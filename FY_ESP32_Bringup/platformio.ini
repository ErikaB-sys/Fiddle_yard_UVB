[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = hexlify
build_flags =
    -I include
    -D FY_ESP32_BRINGUP=1
    -D FY_STATUS_LED_PIN=2
    -D FY_STATUS_LED_ACTIVE_HIGH=1
    ; Bounded motor test on a loose NEMA11 ONLY! Remove/set 0 for FY mechanics.
    -D FY_MOTOR_BENCH_TEST=1
