[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = hexlify
; BENCH ONLY: A loose NEMA11, no FY mechanics; remove/set to 0 before mounting.
build_flags =
    -I include
    -D FY_ESP32_BRINGUP=1
    -D FY_STATUS_LED_PIN=2
    -D FY_STATUS_LED_ACTIVE_HIGH=1
    -D FY_MOTOR_BENCH_TEST=1

; Separater MISRA-orientierter Prueflauf: pio run -t misra
; Kein automatisches Gate vor Baseline-Review (#163).
extra_scripts =
    pre:scripts/pio_misra.py
