[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
;monitor_filters = hexlify
lib_deps =
    olikraus/U8g2 @ 2.36.18
build_flags =
    -I include
    -D FY_ESP32_BRINGUP=1
    -D FY_STATUS_LED_PIN=2
    -D FY_STATUS_LED_ACTIVE_HIGH=1
    ; HTTP-Bedienung mit serverseitiger LOCAL/REMOTE- und Browser-Lease-Sperre.
    ; 0 deaktiviert Web-Fahrbefehle; bei 1 gilt die Bedienhoheit auch im Privatnetz.
    ; Keine Netzwerk-Authentifizierung fuer fremde/unvertrauenswuerdige Teilnehmer.
    -D FY_HTTP_WEB_TEST_CONTROL=1

; TISCHMUSTER NUR: OTA-Freigabe ueber die lokale USB-Serielle.
; Nie auf der eingebauten FY-HW verwenden oder als Release-Binary verteilen.
; Erst per USB flashen, dann im seriellen Monitor "!OTA ARM" senden.
; Die Freigabe erfordert weiterhin STOP-Latch, Motor AUS und Stillstand.
[env:esp32dev_ota_bench]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D FY_OTA_BENCH_TEST_ARM=1

; Separater MISRA-orientierter Prueflauf: pio run -t misra
; Kein automatisches Gate vor Baseline-Review (#163).
extra_scripts =
    pre:scripts/pio_misra.py
