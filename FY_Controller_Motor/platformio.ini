; PlatformIO Project Configuration File
;
;   Build options, upload options and library dependencies

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
board_upload.speed = 57600

build_flags =
    -I include
    -Wl,-Map=.pio/build/$PIOENV/firmware.map
    !python scripts/git_rev_macro.py

extra_scripts =
    pre:scripts/misra_check.py
    post:scripts/copy_map.py

lib_deps =
    olikraus/U8g2
    xreef/PCF8574 library

monitor_speed = 115200
